name: Compilación

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: fabric, mc: '1.20', java: '21', gradle: '9.6.0' }
          - { loader: fabric, mc: '1.20.1', java: '21', gradle: '9.6.0' }
          - { loader: fabric, mc: '1.20.2', java: '21', gradle: '9.6.0' }
          - { loader: fabric, mc: '1.20.3', java: '21', gradle: '9.6.0' }
          - { loader: fabric, mc: '1.20.4', java: '21', gradle: '9.6.0' }
          - { loader: fabric, mc: '1.20.5', java: '21', gradle: '9.6.0' }
          - { loader: fabric, mc: '1.20.6', java: '21', gradle: '9.6.0' }
          - { loader: fabric, mc: '26.3', java: '25', gradle: '9.6.0' }

          - { loader: forge, mc: '1.20', java: '21', forge: '46.0.14', gradle: '8.8' }
          - { loader: forge, mc: '1.20.1', java: '21', forge: '47.4.26', gradle: '8.8' }
          - { loader: forge, mc: '1.20.2', java: '21', forge: '48.1.0', gradle: '8.8' }
          - { loader: forge, mc: '1.20.3', java: '21', forge: '49.0.2', gradle: '8.8' }
          - { loader: forge, mc: '1.20.4', java: '21', forge: '49.2.9', gradle: '8.8' }
          - { loader: forge, mc: '1.20.6', java: '21', forge: '50.2.10', gradle: '8.8' }

          - { loader: neoforge, mc: '1.20.4', java: '21', neoforge: '20.4.238', gradle: '8.8' }
          - { loader: neoforge, mc: '1.20.6', java: '21', neoforge: '20.6.115', gradle: '8.14' }
          - { loader: neoforge, mc: '26.3', java: '25', neoforge: '26.3.0.42-beta', gradle: '9.6.0' }

    runs-on: ubuntu-latest
    name: ${{ matrix.loader }} ${{ matrix.mc }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Compilar
        shell: bash
        run: |
          args=("build" "--no-daemon" "-Ploader=${{ matrix.loader }}" "-Pminecraft_version=${{ matrix.mc }}")
          if [ -n "${{ matrix.forge }}" ]; then args+=("-Pforge_version=${{ matrix.forge }}"); fi
          if [ -n "${{ matrix.neoforge }}" ]; then args+=("-Pneoforge_version=${{ matrix.neoforge }}"); fi
          if [ -n "${{ matrix.fabric_loader }}" ]; then args+=("-Pfabric_loader_version=${{ matrix.fabric_loader }}"); fi
          gradle "${args[@]}"

      - name: Subir JAR individual
        uses: actions/upload-artifact@v4
        with:
          name: AssetsLoaderMod-${{ matrix.loader }}-${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Preparar JAR para paquete
        shell: bash
        run: |
          mkdir -p "paquetes/${{ matrix.loader }}/${{ matrix.mc }}"
          cp build/libs/*.jar "paquetes/${{ matrix.loader }}/${{ matrix.mc }}/AssetsLoaderMod-${{ matrix.mc }}-${{ matrix.loader }}.jar"

      - name: Subir JAR preparado
        uses: actions/upload-artifact@v4
        with:
          name: paquete-${{ matrix.loader }}-${{ matrix.mc }}
          path: paquetes/${{ matrix.loader }}/${{ matrix.mc }}/

  empaquetar:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        loader: [forge, fabric, neoforge]

    steps:
      - name: Descargar JAR de versiones
        uses: actions/download-artifact@v4
        with:
          pattern: paquete-${{ matrix.loader }}-*
          path: paquetes
          merge-multiple: true

      - name: Crear ZIP
        shell: bash
        run: |
          mkdir -p "distribucion/AssetsLoaderMod-${{ matrix.loader }}"
          while IFS= read -r -d '' archivo; do
            cp "$archivo" "distribucion/AssetsLoaderMod-${{ matrix.loader }}/"
          done < <(find "paquetes" -type f -name '*.jar' -print0)
          cd distribucion
          zip -r "../AssetsLoaderMod-${{ matrix.loader }}.zip" "AssetsLoaderMod-${{ matrix.loader }}"

      - name: Subir ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AssetsLoaderMod-${{ matrix.loader }}
          path: AssetsLoaderMod-${{ matrix.loader }}.zip
          if-no-files-found: error
