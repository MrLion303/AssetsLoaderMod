name: Compilación

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    name: ${{ matrix.loader }} - Minecraft 1.20.1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            gradle: 9.6.0
          - loader: forge
            gradle: 8.8

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle
        shell: bash
        run: |
          curl -fsSL "https://services.gradle.org/distributions/gradle-${{ matrix.gradle }}-bin.zip" -o gradle.zip
          unzip -q gradle.zip -d gradle-dist
          echo "$GITHUB_WORKSPACE/gradle-dist/gradle-${{ matrix.gradle }}/bin" >> "$GITHUB_PATH"

      - name: Compilar mod
        shell: bash
        run: |
          args=("build" "--no-daemon" "-Ploader=${{ matrix.loader }}" "-Pminecraft_version=1.20.1")
          if [ "${{ matrix.loader }}" = "forge" ]; then
            args+=("-Pforge_version=47.4.20")
          fi
          gradle "${args[@]}"

      - name: Preparar JAR
        shell: bash
        run: |
          jar=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "$jar" ]; then
            echo "No se encontró el JAR compilado."
            exit 1
          fi
          cp "$jar" "AssetsLoaderMod-${{ matrix.loader }}-1.20.1.jar"

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: AssetsLoaderMod-${{ matrix.loader }}-1.20.1
          path: AssetsLoaderMod-${{ matrix.loader }}-1.20.1.jar
          if-no-files-found: error
