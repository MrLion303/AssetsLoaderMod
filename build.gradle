buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.+'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
        if (project.hasProperty('loader') && project.property('loader').toString().equalsIgnoreCase('fabric')) {
            classpath 'net.fabricmc:fabric-loom:1.17.21'
        }
    }
}

plugins {
    id 'java'
    id 'maven-publish'
}

def loader = (findProperty('loader') ?: 'forge').toString().toLowerCase()
def minecraftVersion = (findProperty('minecraft_version') ?: '1.20.1').toString()
def is26 = false
def isNeo = loader == 'neoforge'
def isFabric = loader == 'fabric'
def isForge = loader == 'forge'
def javaVersion = 17

def supported = [
    fabric: ['1.20.1'],
    forge: ['1.20.1']
]
if (!supported.containsKey(loader) || !supported[loader].contains(minecraftVersion)) {
    throw new GradleException("Combinación no soportada: ${loader} + Minecraft ${minecraftVersion}. Solo se compila Fabric y Forge para Minecraft 1.20.1.")
}

group = mod_group_id
version = "${mod_version}+mc${minecraftVersion}-${loader}"

tasks.withType(Jar).configureEach {
    archiveBaseName.set(mod_id)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
}

sourceSets {
    main {
        java.srcDirs = [
            'src/common/java',
            "src/variants/${loader}/java",
            'src/variants/1.20/java'
        ]
        resources.srcDirs = [
            'src/common/resources',
            "src/variants/${loader}/resources"
        ]
    }
}

if (isFabric) {
    apply plugin: 'fabric-loom'

    loom {
        runs {
            client { client() }
            server { server() }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraftVersion}"
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:0.17.2"
    }
} else if (isForge) {
    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'org.spongepowered.mixin'

    minecraft {
        mappings channel: 'official', version: minecraftVersion
        copyIdeResources = true
        runs {
            client {}
            server {}
        }
    }

    dependencies {
        minecraft "net.minecraftforge:forge:${minecraftVersion}-${project.findProperty('forge_version')}"
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    }

    mixin {
        add sourceSets.main, 'assetsloadermod.refmap.json'
        config 'assetsloadermod.mixins.json'
    }

    jar {
        manifest.attributes(['MixinConfigs': 'assetsloadermod.mixins.json,assetsloadermod.forge.mixins.json'])
    }

    tasks.named('jar', Jar).configure {
        finalizedBy 'reobfJar'
    }
}

processResources {
    def props = [
        minecraft_version: minecraftVersion,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: project.version,
        mod_authors: mod_authors,
        mod_description: mod_description,
        java_version: javaVersion,
        forge_version: project.findProperty('forge_version') ?: '',
        fabric_loader_version: '0.17.2'
    ]

    inputs.properties(props)

    filesMatching([
        'assetsloadermod.mixins.json',
        'fabric.mod.json',
        'META-INF/mods.toml'
    ]) {
        expand props
    }

    exclude 'META-INF/neoforge.mods.toml'
    if (!isFabric) exclude 'fabric.mod.json'
    if (!isForge) exclude 'META-INF/mods.toml'
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'Specification-Title': mod_name,
        'Specification-Vendor': mod_authors,
        'Implementation-Title': mod_name,
        'Implementation-Version': project.version
    ])
}
