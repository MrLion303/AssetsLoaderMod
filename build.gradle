buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.+'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
        classpath 'net.fabricmc:fabric-loom:1.17.21'
        classpath 'net.neoforged.moddev:net.neoforged.moddev.gradle.plugin:2.0.147'
    }
}

plugins {
    id 'java'
    id 'maven-publish'
}

def loader = (findProperty('loader') ?: 'forge').toString().toLowerCase()
def minecraftVersion = (findProperty('minecraft_version') ?: '1.20.1').toString()
def is26 = minecraftVersion == '26.3'
def isNeo = loader == 'neoforge'
def isFabric = loader == 'fabric'
def isForge = loader == 'forge'
def javaVersion = is26 ? 25 : ((minecraftVersion == '1.20.5' || minecraftVersion == '1.20.6') ? 21 : 17)

def supported = [
    fabric: ['1.20','1.20.1','1.20.2','1.20.3','1.20.4','1.20.5','1.20.6','26.3'],
    forge: ['1.20','1.20.1','1.20.2','1.20.3','1.20.4','1.20.5','1.20.6'],
    neoforge: ['1.20.4','1.20.6','26.3']
]
if (!supported.containsKey(loader) || !supported[loader].contains(minecraftVersion)) {
    throw new GradleException("Combinación no soportada: ${loader} + Minecraft ${minecraftVersion}")
}

group = mod_group_id
version = "${mod_version}+mc${minecraftVersion}-${loader}"

tasks.withType(Jar).configureEach {
    archiveBaseName.set(mod_id)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
}

sourceSets {
    main {
        java.srcDirs = [
            'src/common/java',
            "src/variants/${loader}/java",
            "src/variants/${is26 ? '26.3' : '1.20'}/java"
        ]
        resources.srcDirs = [
            'src/common/resources',
            "src/variants/${loader}/resources"
        ]
    }
}

if (isFabric) {
    apply plugin: 'fabric-loom'

    loom {
        runs {
            client { client() }
            server { server() }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraftVersion}"
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${is26 ? '0.19.5' : '0.17.2'}"
    }
} else if (isNeo) {
    apply plugin: 'net.neoforged.moddev'

    neoForge {
        version = project.findProperty('neoforge_version').toString()
        runs {
            client { client() }
            server { server() }
        }
        mods {
            assetsloadermod {
                sourceSet sourceSets.main
            }
        }
    }
} else if (isForge) {
    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'org.spongepowered.mixin'

    minecraft {
        mappings channel: 'official', version: minecraftVersion
        copyIdeResources = true
        runs {
            client {}
            server {}
        }
        mods {
            assetsloadermod {
                source sourceSets.main
            }
        }
    }

    dependencies {
        minecraft "net.minecraftforge:forge:${minecraftVersion}-${project.findProperty('forge_version')}"
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    }

    mixin {
        add sourceSets.main, 'assetsloadermod.refmap.json'
        config 'assetsloadermod.mixins.json'
    }

    jar {
        manifest.attributes(['MixinConfigs': 'assetsloadermod.mixins.json'])
    }

    if (minecraftVersion < '1.20.5') {
        tasks.named('jar', Jar).configure {
            finalizedBy 'reobfJar'
        }
    }
}

processResources {
    def props = [
        minecraft_version: minecraftVersion,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: project.version,
        mod_authors: mod_authors,
        mod_description: mod_description,
        java_version: javaVersion,
        forge_version: project.findProperty('forge_version') ?: '',
        neoforge_version: project.findProperty('neoforge_version') ?: '',
        fabric_loader_version: is26 ? '0.19.5' : '0.17.2'
    ]

    inputs.properties(props)

    filesMatching([
        'assetsloadermod.mixins.json',
        'fabric.mod.json',
        'META-INF/mods.toml',
        'META-INF/neoforge.mods.toml'
    ]) {
        expand props
    }

    if (isNeo && minecraftVersion == '1.20.4') {
        filesMatching('META-INF/neoforge.mods.toml') {
            it.path = 'META-INF/mods.toml'
        }
    }

    if (!isNeo) exclude 'META-INF/neoforge.mods.toml'
    if (!isFabric) exclude 'fabric.mod.json'
    if (!isForge) exclude 'META-INF/mods.toml'
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'Specification-Title': mod_name,
        'Specification-Vendor': mod_authors,
        'Implementation-Title': mod_name,
        'Implementation-Version': project.version
    ])
}
